services:
  - type: web
    name: halalsheba-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "Halal Sheba"
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: "base64:zEaFh3kbooR+9eZEAfhQ/v/LeLqrZlKgVo3IBevX9oI="
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: halalsheba-db
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: halalsheba-db
          property: connectionString

databases:
  - name: halalsheba-db
    plan: free
    region: singapore
