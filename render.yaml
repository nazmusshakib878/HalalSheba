services:
  - type: web
    name: halalsheba-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: singapore
    envVars:
      - key: APP_NAME
        value: "Halal Sheba"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: halalsheba-db
          property: connectionString

databases:
  - name: halalsheba-db
    plan: free
    region: singapore
